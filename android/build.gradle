 buildscript {
    ext.kotlin_version = '1.6.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
// --- 核心兼容补丁：教老版 Gradle 认识新语法 ---
 subprojects {
     afterEvaluate { project ->
         if (project.hasProperty('android')) {
             // 1. 拦截 namespace，防止老版 AGP 报错
             project.android.metaClass.namespace = { String ns -> }
             project.android.metaClass.setNamespace = { String ns -> }

             // 2. 拦截 compileSdk，将其重定向到老版的 compileSdkVersion
             project.android.metaClass.compileSdk = { int sdk ->
                 project.android.compileSdkVersion(sdk)
             }
             project.android.metaClass.setCompileSdk = { int sdk ->
                 project.android.compileSdkVersion(sdk)
             }

             // 3. 针对 targetSdk 同理处理
             project.android.metaClass.targetSdk = { int sdk ->
                 project.android.defaultConfig.targetSdkVersion(sdk)
             }
             project.android.metaClass.setTargetSdk = { int sdk ->
                 project.android.defaultConfig.targetSdkVersion(sdk)
             }
         }
         project.configurations.all {
             resolutionStrategy {
                 force 'androidx.core:core:1.6.0'
                 force 'androidx.core:core-ktx:1.6.0'
             }
         }
     }
 }